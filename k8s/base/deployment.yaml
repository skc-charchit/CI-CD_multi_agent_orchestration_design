apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
        - name: backend-app
          image: your-registry/backend-app:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_NAME
              value: "backend-app"
            - name: DEBUG
              value: "False"
