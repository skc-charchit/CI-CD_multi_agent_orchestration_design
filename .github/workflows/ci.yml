name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Lint backend
        run: uv run ruff check app/backend/src app/backend/tests scripts

      - name: Check Python formatting
        run: uv run ruff format --check app/backend/src app/backend/tests scripts

      - name: Verify OpenAPI contract snapshot
        run: uv run python scripts/export_openapi.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend

      - name: Build frontend
        run: npm run build
        working-directory: app/frontend

      - name: Install project guide dependencies
        run: npm ci
        working-directory: app/features/project-guide

      - name: Build project guide feature independently
        run: npm run build
        working-directory: app/features/project-guide

      - name: Build package
        run: uv build
