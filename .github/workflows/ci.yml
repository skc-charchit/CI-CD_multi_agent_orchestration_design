name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: astral-sh/setup-uv@v5
        name: Set up uv and Python
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: uv sync --locked --dev
      - name: Run backend tests
        run: uv run pytest -q
      - name: Lint backend
        run: uv run ruff check app/backend/src app/backend/tests scripts
      - name: Check Python formatting
        run: uv run ruff format --check app/backend/src app/backend/tests scripts
      - name: Verify OpenAPI contract snapshot
        run: uv run python scripts/export_openapi.py --check
      - name: Build Python package
        run: uv build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: actions/setup-node@v4
        name: Set up Node.js
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend
      - name: Build frontend
        run: npm run build
        working-directory: app/frontend

  project-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: actions/setup-node@v4
        name: Set up Node.js
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/features/project-guide/package-lock.json
      - name: Install project guide dependencies
        run: npm ci
        working-directory: app/features/project-guide
      - name: Build project guide feature independently
        run: npm run build
        working-directory: app/features/project-guide

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx
      - uses: docker/build-push-action@v6
        name: Build backend container
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: azure/setup-kubectl@v4
        name: Set up kubectl
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/base > "$RUNNER_TEMP/k8s-rendered.yaml"
